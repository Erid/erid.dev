entry: GoPato — Chief Technology Officer
employer: GoPato
title: Chief Technology Officer
start: 2017-06
end: 2018-05
location: Cartago, Costa Rica
employmentType: ''
contributions:
  - >-
    Hired and led a team that built a delivery platform from scratch, spanning
    customer and driver apps, store order tracking, and an internal logistics
    dashboard with a live map of orders.
  - >-
    Defined architecture and UX and developed the platform with React,
    React Native, Node.js, GraphQL, and microservices. Delivered the customer
    web app across browsers, a React Native shell, and Facebook Messenger.
  - >-
    Built real-time location tracking for the React Native driver app and used
    PostGIS for driver assignment logic, with delivery duration estimates
    incorporating real-time traffic.
  - >-
    Explored C++ drone navigation integration and worked with stakeholders on
    product and technology decisions.
technologies:
  - React
  - React Native
  - Node.js
  - GraphQL
  - Microservices
  - C++
  - PostGIS
  - Software Architecture
  - AWS
  - Docker
  - PostgreSQL
