contributions:
  - Hired three full-time developers, one part-time developer, and a full-time UX designer to build
    a delivery platform spanning customer and driver apps, store order tracking, and logistics
    dashboards.
  - Owned architecture, infrastructure, delivery workflows, and live troubleshooting; shaped product
