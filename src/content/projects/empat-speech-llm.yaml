entry: empat-speech-llm
title: LLM Story Generation & Clinical Progress Reports
summary: >-
  Built two production LLM workflows on AWS Bedrock and Gemini: multi-page visual story generation
  with persistent character context, dynamic student questions, and real-time SSE streaming, plus
  schema-validated clinical progress reports linked to source sessions.
role: Full Stack Engineer · Empat Speech
technologies:
  - AWS Bedrock
  - Gemini
  - Server-Sent Events (SSE)
  - TypeScript
  - React
  - Node.js
  - AWS
outcomes:
  - Maintained character and scene consistency across multi-page stories by generating and storing
    structured actor context via AWS Bedrock prior to image generation.
  - Built a provider-agnostic image generation adapter layer (using Gemini) with real-time
    Server-Sent Events (SSE) notifications as text and illustrations finish rendering.
  - Automated structured clinical progress reports from pre-calculated metrics and session notes,
    with direct session references so clinicians can fact-check every generated statement.
