entry: gopato-graphql-incident
title: Resolving a Peak-Hour GraphQL Subscription Incident
summary: Resolved a launch-period GraphQL subscription overload in a delivery platform. Added
  automated stress testing to catch future fan-out regressions.
role: Chief Technology Officer · GoPato
technologies:
  - GraphQL
  - Apollo
  - Node.js
  - Microservices
  - React
  - React Native
outcomes:
  - Contained a peak-hour launch outage where customer orders were not being picked up and drivers
    could not accept deliveries.
  - Traced runaway load in Apollo GraphQL telemetry to a subscription filter bug that triggered a
    connection feedback loop on every new order.
  - Shipped a live fix that restored order flow within minutes, followed by stress testing to catch
    subscription fan-out issues before production.
