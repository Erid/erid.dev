entry: empat-speech-pii
title: HIPAA-Minded PII Isolation & Access Control
summary: >-
  Architected external PII storage, an AWS SQS synchronization pipeline with dead-letter queueing,
  and multi-layered Cognito and AppSync access control so sensitive student data never lives in the
  primary database or leaks to unauthenticated therapy sessions.
role: Full Stack Engineer · Empat Speech
technologies:
  - AWS SQS
  - AWS Cognito
  - AWS AppSync
  - TypeScript
  - Node.js
  - SST
  - AWS
outcomes:
  - Kept personally identifiable information (PII) outside the primary application databases via an
    isolated ID-mapping layer and external provider synchronization.
  - Prevented data loss during third-party or network issues using an AWS SQS queue and dead-letter
    queue (DLQ) for failure visibility and recovery without permanent local PII storage.
  - Enforced API-level data minimization so unauthenticated student therapy sessions never receive
    personal data in API responses, not merely hidden in the UI.
