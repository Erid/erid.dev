summary: Full-stack engineer with 15+ years building web and mobile products, including
  first-engineer ownership, architecture, team leadership, and CTO experience. Built platforms from
  the ground up and production LLM workflows with Claude and AWS Bedrock. Combines hands-on product
  delivery with AI-assisted development.
roles:
  - experience: empat-speech
    bullets:
      - First engineering hire; owned architecture, infrastructure, CI/CD, and full-stack delivery,
        working directly with therapists, the CEO, and CTO to turn requirements and operational
        problems into product improvements.
      - Built a speech therapy platform used by approximately 10 therapists across an estimated 15
        schools, combining live video, interactive games, session data collection, and progress
        analysis.
      - Built progress reporting and compliance workflows that reduced therapists’ time spent on
        those tasks by an estimated 80%, freeing time for therapy.
      - Built production LLM workflows with Claude via AWS Bedrock for visual stories and clinical
        reports, using structured outputs, pre-calculated metrics, and source-session references.
      - Designed external PII storage and SQS synchronization with dead-letter queue recovery, plus
        API-level access controls for student therapy sessions.
  - experience: catch-health
    bullets:
      - Developed a healthcare platform with real-time communication and payments, working across a
        TypeScript frontend and a Node.js, GraphQL, Hasura, and Prisma backend.
      - Built React and Preact interfaces with Tailwind and Storybook to maintain a consistent,
        reusable UI library.
      - Used Playwright to reach key application states during development and test user flows for
        regressions.
  - experience: clevertech
    bullets:
      - Developed web dashboards and a React and Ionic mobile application deployed to the Apple App
        Store and Google Play Store.
      - Implemented in-app purchases and subscription validation across a TypeScript frontend and a
        Node.js, GraphQL, and Prisma backend.
  - experience: rematter
    bullets:
      - Developed web and mobile software for scrap metal recycling with React and React Native,
        working on a Node.js and GraphQL backend with Sequelize and PostgreSQL.
      - Improved perceived responsiveness and reduced redundant network requests through client-side caching, optimistic UI updates, and request batching.
